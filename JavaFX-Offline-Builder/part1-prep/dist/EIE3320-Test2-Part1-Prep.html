<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Test 2 Part 1 复习</title>
<style>
:root { color-scheme: light; --ink: #1b2a33; --muted: #566a74; --line: #d8e1e4; --accent: #2f5d8a; --soft: #e8f0f8; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 15px; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: #f1f4f6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid #b9c7cd; border-radius: 6px; background: #fff; padding: 6px 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); font-weight: 600; }
input, select { border: 1px solid #b9c7cd; border-radius: 6px; padding: 6px 8px; background: #fff; }
header { background: #1d3550; color: #f1f6fb; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 1.3rem; }
header p { margin: 3px 0 0; font-size: .82rem; color: #c3d4e6; }
.tabs { display: flex; gap: 6px; }
main { max-width: 1100px; margin: 16px auto; padding: 0 16px; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.intro { color: var(--muted); font-size: .88rem; line-height: 1.55; margin: 0 0 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar input[type="search"] { flex: 1 1 240px; }
.inline { display: inline-flex; gap: 5px; align-items: center; font-size: .88rem; }
.muted { color: var(--muted); font-size: .85rem; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.item.known { opacity: .55; }
.item summary { cursor: pointer; line-height: 1.45; }
.item p { margin: 6px 0 0; padding: 8px; background: #f4f7fa; border-radius: 6px; line-height: 1.5; font-size: .92rem; }
.tag { display: inline-block; font-size: .72rem; padding: 1px 6px; border-radius: 10px; background: var(--soft); color: var(--accent); font-weight: 600; }
.item label { float: right; font-size: .78rem; color: var(--muted); }
.cheatsheet { width: 210mm; min-height: 297mm; max-width: 100%; margin: 10px auto; padding: 7mm; background: #fff; border: 1px solid #ccc;
  column-count: 3; column-gap: 4mm; font: 7.6pt/1.25 "Segoe UI", Arial, sans-serif; color: #000; }
.cheat-title { column-span: all; font-weight: 700; font-size: 9pt; border-bottom: 1px solid #000; margin-bottom: 2mm; padding-bottom: 1mm; }
.cheatsheet section { break-inside: avoid; margin-bottom: 2.2mm; }
.cheatsheet h4 { margin: 0 0 .7mm; font-size: 8.2pt; background: #e6e6e6; padding: .4mm 1mm; }
.cheatsheet p { margin: 0 0 .6mm; }
.cheatsheet code { display: block; font: 6.9pt/1.2 Consolas, "Courier New", monospace; white-space: pre-wrap; margin: 0 0 .6mm; }
[hidden] { display: none !important; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  body { background: #fff; }
  body * { visibility: hidden; }
  #cheatsheet, #cheatsheet * { visibility: visible; }
  #cheatsheet { position: absolute; left: 0; top: 0; margin: 0; border: 0; width: 210mm; height: 297mm; overflow: hidden; }
}
</style>

<header>
  <div>
    <h1>EIE3320 Test 2 · Part 1 笔试复习</h1>

  </div>

<main>

    <p class="intro">题目和答案都用英文，和考卷一致。先勾选「自测」（收起答案），自己答完再点开核对；会了就勾「已掌握」，可以只看没掌握的题。</p>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索：bind、Insets、consume、anonymous…">

<script>
/*
 * Part 1 (closed-book written test) material: a searchable question bank and the content of the
 * one-page A4 cheat sheet. Questions are in English like the test; hints in Chinese.
 */
"use strict";

const THEORY = [
  // ---------- Lecture 7: JavaFX basics ----------
  ["L7", "Name Java's three GUI toolkits from oldest to newest and one weakness of the oldest.", "AWT → Swing → JavaFX. AWT is prone to platform-specific bugs and was replaced by Swing; Swing paints components with Java code; JavaFX is the modern toolkit (2D/3D, animation, media, multitouch, CSS, FXML)."],
  ["L7", "What must the main class of every JavaFX program do?", "extends javafx.application.Application and overrides public void start(Stage primaryStage)."],
  ["L7", "Is a main method required in a JavaFX program?", "Not when run from the command line: the JVM calls launch() automatically. An IDE with limited JavaFX support needs main(String[] args) { launch(args); }."],
  ["L7", "Who creates primaryStage?", "The JavaFX runtime (JVM) creates it automatically when the application is launched and passes it to start()."],
  ["L7", "Explain Stage, Scene and Node with the theatre analogy.", "Stage = the window (platform); Scene = holds the root of the scene graph; Nodes = actors (controls, shapes, panes). 舞台、场景、演员。"],
  ["L7", "What do the three numbers mean in new Scene(btOK, 200, 250)?", "Root node, width 200 px, height 250 px. new Scene(node) sizes the scene from its contents."],
  ["L7", "Which three Stage calls show a window?", "stage.setTitle(\"...\"); stage.setScene(scene); stage.show();"],
  ["L7", "How do you open a second window?", "Stage stage = new Stage(); stage.setScene(new Scene(new Button(\"New Stage\"), 200, 250)); stage.show();"],
  ["L7", "What can be the root of a Scene?", "A Control, a Group or a Pane (any Parent)."],
  ["L7", "How do you add, add several and remove children of a pane?", "pane.getChildren().add(node); pane.getChildren().addAll(n1, n2); pane.getChildren().remove(node); getChildren().clear() removes all."],
  ["L7", "Can the same node be added to two panes, or twice?", "No. A node can be added only once and to only one pane at a time (one parent). Create a new node instead."],
  ["L7", "Describe the Java coordinate system.", "Origin (0, 0) is the upper-left corner; x increases to the right; y increases downward; units are pixels. 向下 y 变大。"],
  ["L7", "Write code to move circle c up by 10 pixels.", "c.setCenterY(c.getCenterY() - 10);  // up = smaller y"],
  ["L7", "What is property binding? Which object is the target?", "target.bind(source): the binding (target) property is updated automatically whenever the bindable/observable (source) property changes."],
  ["L7", "Fill in: keep the circle in the centre of the pane.", "circle.centerXProperty().bind(pane.widthProperty().divide(2)); circle.centerYProperty().bind(pane.heightProperty().divide(2));"],
  ["L7", "Name the three methods every JavaFX property (e.g. hgap) provides.", "Value getter getHgap(), value setter setHgap(double), property getter hgapProperty()."],
  ["L7", "What happens if you call setCenterX() on a bound centerX property?", "A RuntimeException (\"A bound value cannot be set\"). Call unbind() first."],
  ["L7", "Write the JavaFX CSS to give a button a blue border.", "btOK.setStyle(\"-fx-border-color: blue;\"); Prefix -fx-, name: value, separate several styles with semicolons."],
  ["L7", "What happens with incorrect JavaFX CSS?", "It is ignored; no error is reported. 写错的 CSS 不报错，只是无效。"],
  ["L7", "In which direction does pane.setRotate(45) turn the pane?", "Clockwise by 45 degrees around the node's centre. Negative values turn counterclockwise. (Arc angles are the opposite!)"],
  ["L7", "What are the ranges in new Color(r, g, b, opacity)?", "Each value is a double from 0.0 to 1.0; opacity 0.0 = transparent, 1.0 = opaque."],
  ["L7", "Compare Color.rgb(r, g, b) and Color.color(r, g, b).", "Color.rgb uses ints 0–255; Color.color uses doubles 0.0–1.0. Both have versions with opacity. Constants: Color.RED, Color.BLUE ..."],
  ["L7", "Are Color and Font objects mutable? What do brighter()/darker() do?", "Both are immutable. brighter()/darker() return a NEW lighter/darker Color; opacity stays the same."],
  ["L7", "List the ways to create a Font.", "new Font(size), new Font(name, size), Font.font(name, size), Font.font(name, FontWeight, size), Font.font(name, FontWeight, FontPosture, size)."],
  ["L7", "List the FontWeight constants and their values.", "THIN 100, EXTRA_LIGHT 200, LIGHT 300, NORMAL 400, MEDIUM 500, SEMI_BOLD 600, BOLD 700, EXTRA_BOLD 800, BLACK 900. FontPosture: REGULAR, ITALIC."],
  ["L7", "How do you get the names of the fonts installed on the computer?", "Font.getFontNames() (returns a List<String>)."],
  ["L7", "Difference between Image and ImageView?", "Image holds the graphical image (from a file or URL); ImageView is the Node that displays it: new ImageView(image) or new ImageView(\"image/us.gif\")."],
  ["L7", "Can an Image / an ImageView be shared?", "One Image can be shared by many ImageViews; an ImageView is a node and cannot be shared or reused (each can be modified independently)."],
  ["L7", "Make imageView 100×100.", "imageView.setFitWidth(100); imageView.setFitHeight(100); (setPreserveRatio(true) keeps the aspect ratio)."],
  ["L7", "Pane vs Group?", "Panes are resizable containers that lay out children automatically; a Group is non-resizable and applies transformations/scaling to all children as a whole."],
  ["L7", "Which nodes are resizable?", "Panes and UI controls are resizable; Groups, shapes and Text are not."],
  ["L7", "What does StackPane do?", "Centres all children and stacks them on top of each other in adding order (last added on top); keeps them centred when the window resizes."],
  ["L7", "What does FlowPane do? Name its spacing properties.", "Places nodes one after another and starts a new row (HORIZONTAL, default) or column (VERTICAL) when full. hgap = horizontal gap, vgap = vertical gap; setOrientation(Orientation.VERTICAL)."],
  ["L7", "Order of the values in new Insets(11, 12, 13, 14)?", "top, right, bottom, left (clockwise from the top). new Insets(15) uses 15 on every side. Used by setPadding."],
  ["L7", "Name the five BorderPane regions and their methods.", "setTop, setBottom, setLeft, setRight, setCenter (one node each). setTop(null) removes the top node; an empty region takes no space."],
  ["L7", "HBox vs VBox vs FlowPane?", "HBox: one horizontal row; VBox: one vertical column; FlowPane: multiple rows or columns."],
  ["L7", "What does 15 mean in new HBox(15)? And new HBox(10, b1, b2)?", "Spacing of 15 px between children. The second form sets spacing 10 and adds b1 and b2."],
  ["L7", "How do you give one child of a VBox a left margin of 15?", "VBox.setMargin(child, new Insets(0, 0, 0, 15)); — a static method; it only works when the node is inside a VBox."],
  ["L7", "Name the three common properties of the abstract Shape class.", "fill (interior colour), stroke (outline colour), strokeWidth (outline thickness)."],
  ["L7", "List the shape classes covered in Lecture 7.", "Text, Line, Rectangle, Circle, Ellipse, Arc, Polygon, Polyline."],
  ["L7", "What does new Text(20, 20, \"Hi\") draw? How do you break a line?", "The string starting at (20, 20) (baseline). Use \\n for multiple lines; setUnderline(true), setStrikethrough(true), setFont, setFill."],
  ["L7", "Constructor of Line?", "new Line(startX, startY, endX, endY)."],
  ["L7", "Constructor of Rectangle and how to round its corners?", "new Rectangle(x, y, width, height) with (x, y) the upper-left corner; setArcWidth/setArcHeight give the horizontal/vertical diameter of the corner arcs."],
  ["L7", "Constructors of Circle and Ellipse?", "new Circle(centerX, centerY, radius); new Ellipse(centerX, centerY, radiusX, radiusY)."],
  ["L7", "Constructor of Arc and its three types?", "new Arc(centerX, centerY, radiusX, radiusY, startAngle, length); setType(ArcType.OPEN / CHORD / ROUND)."],
  ["L7", "How are Arc angles measured?", "In degrees; 0° points east; positive = counterclockwise, negative = clockwise. length is the angle covered. (Opposite of setRotate.)"],
  ["L7", "Difference between ArcType OPEN, CHORD and ROUND?", "OPEN: only the curve; CHORD: ends joined by a straight line; ROUND: ends joined to the centre (pie slice)."],
  ["L7", "Polygon vs Polyline?", "A Polygon is closed automatically; a Polyline is not. Points: constructor new Polygon(x1, y1, x2, y2, ...) or getPoints() (ObservableList<Double>)."],
  ["L7", "Why do MyEllipse/MyPolygon override setWidth and setHeight?", "JavaFX calls setWidth/setHeight on the scene's root node when the window resizes; the overrides call super.setWidth(width) and then paint() to redraw for the new size."],
  ["L7", "Formula for the hexagon vertices in ShowPolygon?", "x = centerX + radius * cos(2πi/6), y = centerY − radius * sin(2πi/6) for i = 0..5 (minus because y points down)."],
  ["L7", "Why 100 − 50 * Math.sin(...) in SineFunctionPlotter?", "y grows downward, so subtract to draw upward; 100 centres the wave and 50 scales it."],
  ["L7", "Write a custom pane class that shows a label with a red border.", "class CustomPane extends StackPane { public CustomPane(String title) { getChildren().add(new Label(title)); setStyle(\"-fx-border-color: red\"); } }"],

  // ---------- Lecture 8: event-driven programming ----------
  ["L8", "Procedural vs event-driven programming?", "Procedural code runs in procedural order; event-driven code runs when an event is activated."],
  ["L8", "What is an event and what generates it?", "A signal that something has happened, generated by external user actions (mouse movements, clicks, keystrokes) or by the operating system (e.g. a timer)."],
  ["L8", "Define event source, event object and event handler.", "Source: the object that fires the event (e.g. Button). Event object: carries the information (e.g. ActionEvent). Handler/listener: object registered with the source whose handle() method responds."],
  ["L8", "Map the restaurant analogy to the delegation model.", "Customer = event source; food order = event object; waiter = event handler/listener. The waiter waits for orders instead of asking every customer."],
  ["L8", "What does the hollow diamond mean in the delegation-model UML?", "Aggregation: the source holds references to listener objects but does not own their lifetimes."],
  ["L8", "How do you find which object fired the event?", "e.getSource() (defined in EventObject); cast it: Button b = (Button) e.getSource();"],
  ["L8", "Which event type does each action fire: click Button / CheckBox / RadioButton, Enter in TextField, new ComboBox item?", "All fire ActionEvent (register with setOnAction)."],
  ["L8", "Which event types do window, mouse and key actions fire, and what is the source?", "Window opened/closed → WindowEvent (source Window/Stage); mouse pressed/released/... → MouseEvent (source Node); key pressed/released → KeyEvent (source Node)."],
  ["L8", "What two things make an object a valid action handler?", "Its class implements EventHandler<ActionEvent> (overriding handle(ActionEvent e)), and it is registered with the source: source.setOnAction(handler)."],
  ["L8", "Register an object of OKHandlerClass with button btOK.", "btOK.setOnAction(new OKHandlerClass());"],
  ["L8", "Why define a handler as an inner class?", "It is specific to this GUI and not shared; an inner class can use the outer class's data and methods (e.g. circlePane) without passing a reference to its constructor."],
  ["L8", "Rules of an anonymous inner class.", "No name; it must extend a superclass or implement an interface but cannot have an explicit extends/implements clause; it must implement all abstract methods; declaration and creation happen in one step: new InterfaceName() { ... }."],
  ["L8", "Fill in: btUp.setOnAction(new ____<ActionEvent>() { @Override public void ____(ActionEvent e) { ... } });", "EventHandler; handle"],
  ["L8", "What is a functional interface? Why can EventHandler use a lambda?", "An interface with exactly one abstract method. EventHandler<ActionEvent> has only handle(), so a lambda can implement it."],
  ["L8", "Write the lambda forms for one statement and for several statements.", "e -> circlePane.enlarge()   and   e -> { seconds++; label.setText(\"...\"); }"],
  ["L8", "How does the compiler know the type of e in btEnlarge.setOnAction(e -> ...)?", "It infers it from the target type EventHandler<ActionEvent>, so e is an ActionEvent."],
  ["L8", "btOK.setOnAction(e -> print(\"First\")); btOK.setOnAction(e -> print(\"Second\")); What prints on a click?", "Only \"Second\": setOnAction is a setter and the second call replaces the first handler (like x = 1; x = 2;)."],
  ["L8", "How do you use ONE handler for four buttons?", "Create one EventHandler<ActionEvent>, register it with each button, and inside compare e.getSource() == btUp, btDown, ..."],
  ["L8", "Name the MouseButton constants. How do you test for a right click?", "PRIMARY (left), SECONDARY (right), MIDDLE, NONE. if (e.getButton() == MouseButton.SECONDARY)"],
  ["L8", "List the MouseEvent methods.", "getButton(), getClickCount(), getX()/getY() (in the node), getSceneX()/getSceneY(), getScreenX()/getScreenY(), isAltDown(), isControlDown(), isShiftDown(), isMetaDown()."],
  ["L8", "List the mouse event registration methods.", "setOnMousePressed, setOnMouseReleased, setOnMouseClicked, setOnMouseEntered, setOnMouseExited, setOnMouseMoved, setOnMouseDragged."],
  ["L8", "MouseMoved vs MouseDragged?", "Moved: the mouse moves with no button pressed. Dragged: it moves while a button is held down."],
  ["L8", "List the key event registration methods.", "setOnKeyPressed, setOnKeyReleased, setOnKeyTyped."],
  ["L8", "getCode() vs getText() vs getCharacter() in KeyEvent?", "getCode(): the KeyCode constant (UP, A, ...); getText(): text of the key code (empty for arrows); getCharacter(): the character typed (for KeyTyped)."],
  ["L8", "Give some KeyCode constants.", "UP, DOWN, LEFT, RIGHT, HOME, END, PAGE_UP, PAGE_DOWN, ESCAPE, TAB, ENTER, SHIFT, CONTROL, BACK_SPACE, DELETE, CAPS, F1–F12, A–Z, DIGIT0–DIGIT9, UNDEFINED."],
  ["L8", "Why does KeyEventDemo call text.requestFocus() after show()?", "Key events go to the node that has the focus; the Text must be focused to receive key input."],
  ["L8", "In switch (e.getCode()) why write case DOWN: and not case KeyCode.DOWN:?", "The cases of an enum switch use the constant names only."],
  ["L8", "Name the WindowEvent types and their registration methods.", "WINDOW_SHOWING (setOnShowing), WINDOW_SHOWN (setOnShown), WINDOW_HIDING (setOnHiding), WINDOW_HIDDEN (setOnHidden), WINDOW_CLOSE_REQUEST (setOnCloseRequest)."],
  ["L8", "In which order do window events occur when a window opens and is then closed?", "Showing → Shown; clicking ✕: CloseRequest → Hiding → Hidden."],
  ["L8", "How do you stop the window from closing when ✕ is clicked?", "stage.setOnCloseRequest(e -> e.consume());  (consume the event)"],
  ["L8", "Write a Timeline that updates a label every second forever.", "Timeline t = new Timeline(new KeyFrame(Duration.seconds(1), e -> { seconds++; label.setText(\"Time: \" + seconds); })); t.setCycleCount(Timeline.INDEFINITE); t.play();"],
  ["L8", "play(), pause() and stop() of a Timeline?", "play(): start or resume; pause(): stop and keep the position; stop(): stop and go back to the start."],
  ["L8", "Where does System.out.println output appear in BlueJ?", "In the Terminal window (View > Show Terminal)."],

  // ---------- OOP in JavaFX (Assignment 2) ----------
  ["OOP", "What is an abstract class?", "Declared abstract; cannot be instantiated with new; may have fields, constructors, concrete and abstract methods. A concrete subclass must implement every abstract method."],
  ["OOP", "What is an interface? How many can a class implement?", "A type whose methods are public and abstract by default; a class implements it. A class can implement many interfaces but extends only one class."],
  ["OOP", "Shape s = new JavaFXCircle(); s.draw(pane); Which draw() runs and why?", "JavaFXCircle's draw(): dynamic binding chooses the method of the actual object at runtime (polymorphism). The compiler only checks that Shape/Drawable declares draw()."],
  ["OOP", "Can abstract class Shape implement Drawable without writing draw()?", "Yes. The concrete subclass (JavaFXCircle) must then implement draw()."],
  ["OOP", "Overloading vs overriding?", "Overloading: same name, different parameter lists (chosen at compile time). Overriding: same signature in a subclass (chosen at run time). @Override makes the compiler check the signature."],
  ["OOP", "List the rules for constructors.", "Same name as the class, no return type, called with new. super(...) or this(...) must be the first statement. If no constructor is written, a default no-arg constructor is provided."],
  ["OOP", "What does protected allow?", "Access from the same package and from subclasses, e.g. JavaFXCircle uses x, y, area of Shape."],
  ["OOP", "Can an overriding method reduce visibility (e.g. public → protected)?", "No, compile error. Interface methods are public, so implementations must be public."],
  ["OOP", "Why does the A2 main app store the current shape in a Shape variable?", "Programming to the superclass: any subclass can be stored and the buttons call setColor/moveUp/draw polymorphically."],
  ["OOP", "Why clear the canvas before drawing the shape again?", "Each draw() adds a new node; without getChildren().clear() the old circles stay on screen."],
  ["OOP", "What happens if a button calls activeShape.moveUp() while activeShape is null?", "NullPointerException; check if (activeShape != null) first."],
  ["OOP", "What does (Button) e.getSource() do and what if the source is not a Button?", "Downcasts the Object to Button; a wrong cast throws ClassCastException at runtime."],
  ["OOP", "Area and perimeter formulas: circle, rectangle, square.", "Circle: πr² and 2πr; rectangle: w×h and 2(w+h); square: s² and 4s. Math.PI; cast to float: (float) (Math.PI * r * r)."],

  // ---------- Lab 3: ArrayList, text files, Alert ----------
  ["Lab3", "Write code to read a text file line by line.", "try (Scanner input = new Scanner(new File(\"books.txt\"))) { while (input.hasNextLine()) { String line = input.nextLine(); ... } } catch (FileNotFoundException ex) { ... }"],
  ["Lab3", "Write code to save a list to a text file.", "try (PrintWriter output = new PrintWriter(\"books.txt\")) { for (Book b : books) output.println(b.getISBN() + \",\" + b.getTitle() + \",\" + b.isAvailable()); } catch (FileNotFoundException ex) { ... }"],
  ["Lab3", "Split \"0131450913,HTML How to Program,true\" into a Book.", "String[] parts = line.split(\",\"); new Book(parts[0], parts[1], Boolean.parseBoolean(parts[2])). Numbers: Integer.parseInt / Double.parseDouble."],
  ["Lab3", "Why use try-with-resources for files?", "The Scanner/PrintWriter is closed automatically (and output flushed) even if an exception occurs."],
  ["Lab3", "Which exception must be handled for new Scanner(File) and new PrintWriter(String)?", "FileNotFoundException (a checked IOException)."],
  ["Lab3", "List common ArrayList methods.", "add(e), add(i, e), get(i), set(i, e), remove(i) / remove(obj), size(), isEmpty(), contains(obj), indexOf(obj), clear(), sort(comparator)."],
  ["Lab3", "Why not remove items inside a for-each loop over the same ArrayList?", "It throws ConcurrentModificationException; use an Iterator's remove() or an index loop."],
  ["Lab3", "Write a case-insensitive partial title search.", "book.getTitle().toLowerCase().contains(key.trim().toLowerCase())"],
  ["Lab3", "== vs equals() for Strings?", "equals() compares the characters; == compares references (same object)."],
  ["Lab3", "Sort an ArrayList<Book> by title, then reverse.", "books.sort((a, b) -> a.getTitle().compareToIgnoreCase(b.getTitle())); reverse: swap a and b (or comparator.reversed())."],
  ["Lab3", "Write code for an error pop-up.", "Alert alert = new Alert(Alert.AlertType.ERROR); alert.setTitle(\"...\"); alert.setHeaderText(\"Error\"); alert.setContentText(message); alert.showAndWait();"],
  ["Lab3", "How do you disable a button and how do you clear a TextField?", "button.setDisable(true); textField.clear(); (or setText(\"\"))."],
  ["Lab3", "Show the current date and time as 2026-11-26 08:30:00.", "LocalDateTime.now().format(DateTimeFormatter.ofPattern(\"yyyy-MM-dd HH:mm:ss\"))"],

const Theory = {
  list: THEORY.map(([cat, q, a], i) => ({ id: i + 1, cat, q, a })),
  categories: [["L7", "Lecture 7 JavaFX 基础"], ["L8", "Lecture 8 事件驱动"], ["OOP", "OOP（A2）"], ["Lab3", "Lab 3 文件与列表"], ["Java", "Java 基础"]],
  cheatSheet: CHEAT_SHEET,
  search(query, cat = "") {
    const words = String(query ?? "").toLowerCase().split(/\s+/).filter(Boolean);
    return Theory.list.filter(item => (!cat || item.cat === cat) &&
      words.every(w => (item.q + " " + item.a).toLowerCase().includes(w)));
  }
};

;(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem("part1prep." + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem("part1prep." + key, JSON.stringify(value)); } catch { /* storage unavailable */ } }
  };
  const known = new Set(store.get("known", []));
  let randomIds = null;

  const category = $("category");
  for (const [value, label] of [["", "全部类别"], ...Theory.categories]) {
    const option = el("option", null, label);
    option.value = value;
    category.append(option);
  }

  function render() {
    let items = Theory.search($("search").value, category.value);
    if ($("unknown").checked) items = items.filter(q => !known.has(q.id));
    if (randomIds) items = Theory.list.filter(q => randomIds.includes(q.id));
    $("count").textContent = items.length + " / " + Theory.list.length + " 题 · 已掌握 " + known.size;
    $("list").replaceChildren(...items.map(q => {
      const box = el("details", "item" + (known.has(q.id) ? " known" : ""));
      box.open = !$("hide").checked;
      const summary = el("summary");
      const mark = el("label");
      const check = el("input");
      check.type = "checkbox";
      check.checked = known.has(q.id);
      check.addEventListener("click", e => e.stopPropagation());
      check.addEventListener("change", () => {
        if (check.checked) known.add(q.id); else known.delete(q.id);
        store.set("known", [...known]);
        box.classList.toggle("known", check.checked);
        $("count").textContent = items.length + " / " + Theory.list.length + " 题 · 已掌握 " + known.size;
      });
      mark.append(check, " 已掌握");
      summary.append(el("span", "tag", q.cat), " " + q.q, mark);
      box.append(summary, el("p", null, q.a));
      return box;
    }));
  }

  function renderSheet() {
    const title = "EIE3320 Test 2 · JavaFX & Events · " + $("sheet-name").value + " " + $("sheet-id").value;
    $("cheatsheet").replaceChildren(el("div", "cheat-title", title), ...Theory.cheatSheet.map(sec => {
      const s = el("section");
      s.append(el("h4", null, sec.title), ...sec.lines.map(line => line.startsWith("`") ? el("code", null, line.slice(1)) : el("p", null, line)));
      return s;
    }));
    store.set("sheet", { name: $("sheet-name").value, id: $("sheet-id").value });
  }

  function show(tab) {
    $("bank").hidden = tab !== "bank";
    $("sheet").hidden = tab !== "sheet";
    $("tab-bank").setAttribute("aria-pressed", String(tab === "bank"));
    $("tab-sheet").setAttribute("aria-pressed", String(tab === "sheet"));
    store.set("tab", tab);
  }

  for (const id of ["search", "category", "hide", "unknown"]) $(id).addEventListener(id === "search" ? "input" : "change", () => { randomIds = null; render(); });
  $("random").addEventListener("click", () => {
    const pool = Theory.list.filter(q => !known.has(q.id));
    const source = pool.length >= 10 ? pool : Theory.list;
    const picked = [];
    while (picked.length < Math.min(10, source.length)) {
      const q = source[Math.floor(Math.random() * source.length)];
      if (!picked.includes(q.id)) picked.push(q.id);
    }
    randomIds = picked;
    $("hide").checked = true;
    render();
  });
  $("all").addEventListener("click", () => { randomIds = null; render(); });
  $("tab-bank").addEventListener("click", () => show("bank"));
  $("tab-sheet").addEventListener("click", () => show("sheet"));
  $("print").addEventListener("click", () => window.print());
  const saved = store.get("sheet", { name: "", id: "" });
  $("sheet-name").value = saved.name;
  $("sheet-id").value = saved.id;
  for (const id of ["sheet-name", "sheet-id"]) $(id).addEventListener("input", renderSheet);
  render();
  renderSheet();
  show(location.hash === "#sheet" ? "sheet" : store.get("tab", "bank"));
})();
</script>
